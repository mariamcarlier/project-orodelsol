{% extends "base.html" %}
{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/login.css' %}?v=2">
{% endblock %}

{% block title %}Iniciar Sesión{% endblock %}

{% block content %}
<div class="login-overlay">
  <div class="login-card">
    <h2>Iniciar Sesión</h2>
    <p class="login-subtitle">Ingresa tus datos para acceder</p>

    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit">Iniciar Sesion</button>
    </form>
  </div>

  <div class="options">
    <p>¿Olvidaste tu contraseña? <a href="{% url 'password_reset' %}">Recuperar contraseña</a></p>
  </div>
</div>
{% endblock %}
